kind = "web"
previewPath = "/"
title = "ADEP — The AI Decision Council"
version = "1.0.0"
id = "artifacts/adep"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25629

[services.development]
run = "pnpm --filter @workspace/adep run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/adep", "run", "build" ]
serve = "static"
publicDir = "artifacts/adep/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25629"
BASE_PATH = "/"
